services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: doneflow:latest
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "sqlite:////data/doneflow.db"
      UVICORN_WORKERS: "2"
      APP_MODULE: "src.doneflow.api.main:app"
    volumes:
      - sqlite_data:/data
    restart: unless-stopped

volumes:
  sqlite_data:
